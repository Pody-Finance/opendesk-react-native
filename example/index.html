<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>openDesk RN SDK preview</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #e9e9ec; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .stage { min-height: 100%; display: flex; gap: 40px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 32px 16px; box-sizing: border-box; }
      .phone { width: 375px; max-width: 100%; height: 760px; border-radius: 44px; border: 12px solid #111; overflow: hidden; background: #fff; position: relative; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
      .controls { max-width: 320px; color: #333; }
      .controls h1 { font-size: 20px; margin: 0 0 8px; }
      .controls p { font-size: 14px; line-height: 1.5; color: #555; }
      .controls button { display: block; width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 14px; cursor: pointer; text-align: left; }
      .controls code { background: #fff; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
